[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analysis"
version = "0.1.0"
description = "Tree-sitter and code graph analysis package"
dependencies = [
    "tree-sitter>=0.21.3",
    "networkx>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "graph*", "models*", "parser*"]
