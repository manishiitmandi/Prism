[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
mypy_path = ["apps/backend", "packages/code-analysis"]

[tool.pyright]
include = ["apps/backend", "packages/code-analysis"]
venvPath = "apps/backend"
venv = ".venv"
extraPaths = ["apps/backend", "packages/code-analysis"]
reportMissingImports = "warning"
